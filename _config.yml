# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------
theme: null
title: Xuemei TANG
first_name: Xuemei
middle_name:
last_name: TANG
contact_note: >
  Xuemei TANG's Homepage
keywords: jekyll, jekyll-theme, academic-website, portfolio-website
lang: en
icon: ✨

url: ""
baseurl: ""
last_updated: false
impressum_path:
back_to_top: true

# -----------------------------------------------------------------------------
# About page (homepage)
# -----------------------------------------------------------------------------
about:
  layout: about
  title: about
  permalink: /
  subtitle: Postdoctoral Fellow at Hong Kong Polytechnic University
  profile:
    align: right
    image: avatar.jpg
  selected_papers: true
  social: true
  announcements:
    enabled: true
    scrollable: true
    limit: 5
  latest_posts:
    enabled: true
    scrollable: true
    limit: 3

# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------
blog_name: al-folio
blog_description: a simple whitespace theme for academics
permalink: /blog/:year/:title/

pagination:
  enabled: true

related_blog_posts:
  enabled: true
  max_related: 5

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------
collections:
  books:
    output: true
  news:
    defaults:
      layout: post
    output: true
  projects:
    output: true

# -----------------------------------------------------------------------------
# Markdown
# -----------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# -----------------------------------------------------------------------------
# Plugins
# -----------------------------------------------------------------------------
plugins:
  - jekyll-archives-v2
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-get-json
  - jekyll-imagemagick
  - jekyll-jupyter-notebook
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-tabs
  - jekyll-terser
  - jekyll-toc
  - jekyll-twitter-plugin
  - jemoji

# -----------------------------------------------------------------------------
# JSON Resume (for external data)
# -----------------------------------------------------------------------------
jekyll_get_json:
  - data: resume
    json: assets/json/resume.json

jsonresume:
  - basics
  - work
  - education
  - publications
  - projects
  - volunteer
  - awards
  - certificates
  - skills
  - languages
  - interests
  - references
